# Data mix + schedule (conceptual — no real data is loaded)
pretraining:
  total_tokens: 1_800_000_000_000
  mix:
    - source: common-crawl-fr-en-agri-filtered
      weight: 0.42
    - source: agronomy-textbooks
      weight: 0.11
    - source: fao-open-datasets
      weight: 0.08
    - source: partner-farm-telemetry-serialized
      weight: 0.14
    - source: internal-docs-and-tickets
      weight: 0.05
    - source: code-python-sql
      weight: 0.10
    - source: math-and-reasoning
      weight: 0.10

optimizer:
  name: adamw
  lr_peak: 3.0e-4
  lr_min: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0

schedule:
  warmup_steps: 2000
  total_steps: 480_000
  cosine_decay: true

parallelism:
  tensor: 4
  pipeline: 2
  data: 32
  zero_stage: 3

finetuning:
  sft_epochs: 3
  dpo_epochs: 2
  agronomist_labelers: 6
