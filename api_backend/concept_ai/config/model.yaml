# AgroMind-1 architecture (conceptual)
model:
  name: agromind-1
  family: decoder-only-moe
  params_total: 7_100_000_000
  params_active_per_token: 1_800_000_000
  hidden_size: 4096
  intermediate_size: 14336
  num_layers: 32
  num_attention_heads: 32
  num_kv_heads: 8              # grouped-query attention
  head_dim: 128
  vocab_size: 64000
  max_position_embeddings: 32768
  rope_theta: 1_000_000
  tie_word_embeddings: false
  norm: rmsnorm
  norm_eps: 1.0e-6
  activation: silu

moe:
  num_experts: 8
  experts_per_token: 2
  router: top-k-noisy
  aux_loss_coef: 0.01
  capacity_factor: 1.25

tokenizer:
  type: bpe
  languages: [fr, en]
  special_tokens:
    - "<|user|>"
    - "<|assistant|>"
    - "<|tool_call|>"
    - "<|tool_result|>"
    - "<|parcel|>"

quantization:
  serving_default: int4-awq
  training: bf16
